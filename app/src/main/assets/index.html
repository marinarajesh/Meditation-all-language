const total=1200, offsets=[0];
mins.forEach(m=>offsets.push(offsets.at(-1)+m*60));
// Elapsed time is always derived from the wall clock (Date.now), so screen locks and
// background tabs cannot make the session run longer than 20 minutes.
let lang='en';
try{const saved=localStorage.getItem('med_lang');if(saved&&T[saved])lang=saved}catch(e){}
let base=0, startedAt=0, running=false, timer=0, current=-1, ctx=null, wakeLock=null, warnedVoice=false, statusKey='idle';
const $=id=>document.getElementById(id);
const S=()=>T[lang];
const fmt=n=>{n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};

function setStatus(key){statusKey=key;$('status').textContent=S()[key]}

function renderStatic(){
  const s=S();
  document.documentElement.lang=s.htmlLang;
  document.title=s.title;
  $('pill').textContent=s.pill;
  $('title').textContent=s.title;
  $('subtitle').textContent=s.subtitle;
  $('remainingLabel').textContent=s.remaining;
  $('voiceLabel').textContent=s.voiceLabel;
  $('bellLabel').textContent=s.bellLabel;
  $('langLabel').textContent=s.langLabel;
  $('heading').textContent=s.heading;
  $('note').textContent=s.note;
  $('reset').textContent=s.reset;
  $('steps').innerHTML=s.phases.map((p,i)=>`<li id="item${i}"><span>${i+1}. ${p.name}</span><span>${mins[i]} ${s.minutes}</span></li>`).join('');
  $('lang').value=lang;
  setStatus(statusKey);
  draw();
}

function now(){return running?Math.min(total,base+(Date.now()-startedAt)/1000):base}
function phaseIndex(e){for(let i=0;i<S().phases.length;i++)if(e<offsets[i+1])return i;return S().phases.length-1}

function speak(t){
  if(!$('voice').checked)return;
  if(window.AndroidTTS){AndroidTTS.speak(t,lang);return}
  if(!('speechSynthesis' in window)){setStatus('noSpeech');return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang=S().voiceCode;u.rate=.86;
    const all=speechSynthesis.getVoices();
    const v=all.find(v=>v.lang.toLowerCase().startsWith(lang));
    if(v)u.voice=v;
    else if(all.length&&!warnedVoice){warnedVoice=true;setStatus('noVoice')}
    speechSynthesis.speak(u);
  }catch(e){setStatus('noSpeech')}
}

// AudioContext must be created/resumed inside a user tap (Start) for iOS Safari to play sound.
function ensureAudio(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}
function chime(){
  if(!$('bell').checked||!ctx)return;
  try{[660,880].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.17;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.25)})}catch(e){}
}

async function keepAwake(on){
  if(!('wakeLock' in navigator))return;
  try{
    if(on){if(!wakeLock||wakeLock.released)wakeLock=await navigator.wakeLock.request('screen')}
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}

function draw(e=now()){
  const s=S(), i=phaseIndex(e), done=e>=total;
  $('clock').textContent=fmt(total-e);
  $('stepClock').textContent=done?s.done:fmt(offsets[i+1]-e)+' '+s.thisPart;
  $('progress').setAttribute('stroke-dashoffset',647.17*e/total);
  $('stepName').textContent=done?s.complete:`${i+1}. ${s.phases[i].name}`;
  $('description').textContent=done?s.completeDesc:s.phases[i].desc;
  s.phases.forEach((p,j)=>$('item'+j).classList.toggle('current',j===i&&!done));
  $('start').textContent=running?s.pause:done?s.restart:e>0?s.resume:s.start;
}

// Announces the phase the clock is currently in. If the device was locked across
// several phase boundaries, it jumps straight to the right phase instead of replaying each.
function transition(e){
  const i=phaseIndex(e);
  if(e<total&&i!==current){
    if(current!==-1)chime();
    speak(S().phases[i].voice);
    current=i;
  }
}

function tick(){
  const e=now();
  if(e>=total){
    stop(false);
    chime();
    speak(S().finalVoice);
    setStatus('finished');
  }else{
    transition(e);
  }
  draw(e);
}

function start(){
  if(running)return;
  if(base>=total){base=0;current=-1}
  ensureAudio();
  startedAt=Date.now();running=true;
  keepAwake(true);
  setStatus('running');
  tick();
  timer=setInterval(tick,250);
}

// Stops the clock. Keeps the elapsed time in `base` so Start can resume it.
function stop(cancelSpeech){
  if(running){base=now();running=false}
  clearInterval(timer);
  keepAwake(false);
  if(cancelSpeech){if(window.AndroidTTS)AndroidTTS.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}
}

$('start').onclick=()=>{
  if(running){
    stop(true);
    setStatus('paused');
    draw();
  }else{
    start();
  }
};

$('reset').onclick=()=>{
  stop(true);
  base=0;current=-1;
  setStatus('resetDone');
  draw();
};

$('lang').onchange=e=>{
  lang=e.target.value;
  try{localStorage.setItem('med_lang',lang)}catch(err){}
  renderStatic();
};

// Browsers release the wake lock when the page is hidden; re-request it when it returns.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&running){keepAwake(true);tick()}
});

renderStatic();
</script></body></html>
